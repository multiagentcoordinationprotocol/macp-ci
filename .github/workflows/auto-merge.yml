name: auto-merge

# Reusable auto-merge for Dependabot PRs across every macp-* repo.
# Arms GitHub's native auto-merge once branch-protection's required checks pass
# — it does NOT bypass CI. Policy: patch + minor merge unattended; a major bump
# opens the PR but waits for a human (a green build is not sufficient signal to
# ship a breaking change in a coordination-protocol stack). A caller may set
# allow-major: true to opt out of the hold.
#
# Convention: third-party actions are SHA-pinned; first-party actions/* are
# trusted by major tag.
#
# Auth: the merge is armed with a macp-deps-bot GitHub App installation token
# (MACP_BOT_APP_ID / MACP_BOT_PRIVATE_KEY). A merge made with GITHUB_TOKEN starts
# no `push` workflows on the default branch (no CI on main, no release-plz, no
# image build) — macp-ci#1. Dependabot-triggered runs only see *Dependabot*
# secrets, so both names exist as org Dependabot secrets too. If the secrets are
# absent the workflow falls back to github.token (old behaviour).
#
# 0.x crates/packages: a 0.x minor bump (0.32 -> 0.33) is breaking under SemVer
# §4 / Cargo, but fetch-metadata reports it as semver-minor. It is held like a
# major.
#
# Each repo calls this with a thin workflow:
#   on: pull_request
#   permissions: { contents: write, pull-requests: write }
#   jobs:
#     call:
#       uses: multiagentcoordinationprotocol/macp-ci/.github/workflows/auto-merge.yml@v1.2
#       secrets:
#         MACP_BOT_APP_ID: ${{ secrets.MACP_BOT_APP_ID }}
#         MACP_BOT_PRIVATE_KEY: ${{ secrets.MACP_BOT_PRIVATE_KEY }}
#
# Pass only these two secrets — not `secrets: inherit` — so a moved tag can
# never reach a caller's other secrets.

on:
  workflow_call:
    inputs:
      allow-major:
        description: 'Arm auto-merge even on a major bump'
        required: false
        type: boolean
        default: false
    secrets:
      MACP_BOT_APP_ID:
        description: 'macp-deps-bot App ID (optional; falls back to github.token)'
        required: false
      MACP_BOT_PRIVATE_KEY:
        description: 'macp-deps-bot private key (optional; falls back to github.token)'
        required: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    permissions:
      contents: write
      pull-requests: write
    env:
      HAS_APP: ${{ secrets.MACP_BOT_APP_ID != '' && secrets.MACP_BOT_PRIVATE_KEY != '' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Decide eligibility (patch & minor; majors and 0.x minors held)
        id: gate
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          PREV: ${{ steps.meta.outputs.previous-version }}
          NEW: ${{ steps.meta.outputs.new-version }}
          ALLOW_MAJOR: ${{ inputs.allow-major }}
        run: |
          eligible=false
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) eligible=true ;;
          esac
          # 0.x: a minor change is breaking — hold it like a major.
          prev_major="${PREV%%.*}"; prev_rest="${PREV#*.}"; prev_minor="${prev_rest%%.*}"
          new_rest="${NEW#*.}"; new_minor="${new_rest%%.*}"
          if [ "$UPDATE_TYPE" = "version-update:semver-minor" ] && [ "$prev_major" = "0" ] && [ "$prev_minor" != "$new_minor" ]; then
            echo "0.x minor bump $PREV -> $NEW is breaking; holding for a human."
            eligible=false
          fi
          if [ "$ALLOW_MAJOR" = "true" ]; then eligible=true; fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      - name: Mint macp-deps-bot token
        id: app
        if: ${{ steps.gate.outputs.eligible == 'true' && env.HAS_APP == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MACP_BOT_APP_ID }}
          private-key: ${{ secrets.MACP_BOT_PRIVATE_KEY }}

      - name: Enable auto-merge
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
